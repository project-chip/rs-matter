[package]
name = "rs-matter-fuzz-seedgen"
version = "0.0.0"
edition = "2021"
authors = ["Project CHIP Authors"]
description = "Native Rust implementation of the Matter (Smart-Home) ecosystem - the seeds of the `node` fuzz target"
repository = "https://github.com/project-chip/rs-matter"
license = "Apache-2.0"
publish = false

[dependencies]
# For the clock of the harness
embassy-time-driver = "0.2"
env_logger = "0.11"
# The same features as in the fuzz crate, as it runs the same harness
rs-matter = { path = "../../rs-matter", default-features = false, features = ["std", "rustcrypto", "log", "groups", "case-resumption"] }
