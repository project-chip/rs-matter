name: PublishCrateDryRun

on:
  workflow_dispatch:
    inputs:
      crate:
        required: true
        type: choice
        description: Crate to publish
        # In the order of publishing: each crate after the ones it depends on
        options:
        - rs-matter-codegen
        - rs-matter-macros
        - rs-matter-utils
        - rs-matter-tlv
        - rs-matter-crypto
        - rs-matter-cert
        - rs-matter-pairing
        - rs-matter-im-core
        - rs-matter-dm-core
        - rs-matter-dm-clusters
        - rs-matter-node-core
        - rs-matter-transport
        - rs-matter-sc
        - rs-matter-bdx
        - rs-matter-node
        - rs-matter-im
        - rs-matter-dm
        - rs-matter-respond
        - rs-matter-onboard
        - rs-matter-stack
        - rs-matter

env:
  rust_toolchain: stable

jobs:
  publishdryrun:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src
      - name: Build | Publish Dry Run
        run: cd "${{ github.event.inputs.crate }}"; cargo publish --dry-run
