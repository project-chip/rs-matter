name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "50 6 * * *"
  workflow_dispatch:

# Pushing a new commit to a pull request supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: stable
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crypto-backend: ['rustcrypto', 'mbedtls', 'openssl']
        features: ['', 'alloc', 'os']

    steps:
      - name: Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy, rust-src

      - name: Setup | Rust no-std Riscv32 target
        run: rustup target add riscv32imac-unknown-none-elf

      - name: Setup | Rust no-std Thumbv6 target
        run: rustup target add thumbv6m-none-eabi

      - name: Setup | Rust no-std Thumbv7 target
        run: rustup target add thumbv7em-none-eabi

      - name: Install libdbus
        run: sudo apt-get install -y libdbus-1-dev

      # For the `zeroconf` and `astro-dnssd` mDNS backends
      - name: Install Avahi
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: sudo apt-get install -y libavahi-client-dev libavahi-compat-libdnssd-dev

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `cargo xtask copyright` walks `git log --follow` per file
          # to derive each header's first/last-edit year span. With the
          # default shallow clone (`fetch-depth: 1`) only the synthetic
          # PR merge commit is reachable, so every file collapses to
          # "today" and the check fails on every PR. `0` = full history.
          fetch-depth: 0

      - name: Fmt
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo fmt -- --check

      - name: Copyright
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo xtask copyright

      - name: Xtask Fmt
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cd xtask; cargo fmt -- --check

      - name: Clippy - All
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo clippy --no-deps --all-targets -- -Dwarnings

      # Also covers the optional features that no other step builds (e.g. `ota-dcl`).
      # The steps of `rs-matter` lint the `rs-matter-*` crates too, as they are its path dependencies.
      - name: Clippy - Optional features
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cd rs-matter; cargo clippy --all-targets --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},async-io,log,groups,case-resumption,persistent-subscriptions,ota-dcl,zbus,bluer,qr-scan,pics,backtrace,log-tlv-payload,log-mrp,large-buffers,stack-max-large-im-buffers-4,max-group-keys-per-fabric-2,max-groups-per-fabric-4 -- -Dwarnings

      # The features that do not go with the others: one mDNS backend at a time, and a CASE responder without an initiator
      - name: Clippy - Exclusive features
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: |
          cd rs-matter
          cargo clippy --all-targets --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},async-io,log,zeroconf -- -Dwarnings
          cargo clippy --all-targets --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},async-io,log,astro-dnssd -- -Dwarnings
          cargo clippy --all-targets --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},async-io,log,case-responder-only -- -Dwarnings

      # Each crate on its own, with its own default features. The steps above lint the crates together,
      # so each one gets the features that the others enable in it too.
      - name: Clippy - Each crate
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: |
          for p in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            cargo clippy -p "$p" --all-targets --no-deps -- -Dwarnings
          done

      - name: Clippy - baremetal
        if: matrix.features == '' && matrix.crypto-backend == 'rustcrypto'
        run: cd rs-matter; cargo clippy --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},defmt --target riscv32imac-unknown-none-elf -- -Dwarnings

      - name: Clippy
        run: cd rs-matter; cargo clippy --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},log -- -Dwarnings

      - name: Clippy | defmt
        run: export DEFMT_LOG=trace; cd rs-matter; cargo clippy --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},defmt -- -Dwarnings

      - name: Xtask Clippy
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cd xtask; cargo clippy --no-deps -- -Dwarnings

      - name: Build
        run: cd rs-matter; cargo build --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},log

      - name: Benchmark
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cd rs-matter; cargo bench --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},log

      # The tests of all `rs-matter*` crates, with the features of `rs-matter`, which it forwards to them
      - name: Test
        if: matrix.features == 'os'
        run: cargo test --workspace --exclude rs-matter-examples --exclude rs-matter-tests --exclude rs-matter-codegen --exclude rs-matter-macros --no-default-features --features rs-matter/${{matrix.crypto-backend}},rs-matter/${{matrix.features}},rs-matter/async-io,rs-matter/log,rs-matter/groups,rs-matter/case-resumption,rs-matter/persistent-subscriptions,rs-matter/max-group-keys-per-fabric-2,rs-matter/max-groups-per-fabric-4

      - name: Test - Codegen & Macros
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo test -p rs-matter-codegen -p rs-matter-macros

      - name: Examples
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo build --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},log,zbus

      - name: Examples - Send Sync
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo build -p rs-matter-examples --bin onoff_light_work_stealing --bin onoff_light --bin onoff_light_switch --bin ota_requestor --features zbus,send-sync

      - name: Test - Send Sync
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cd rs-matter; cargo test --features send-sync --test send_sync

      - name: Test - Stack Send Sync
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cd rs-matter-stack; cargo test --features send-sync,async-io

      - name: Test - Large Buffers
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: |
          cd rs-matter
          cargo test --features async-io,large-buffers --test commissioning
          # 4 KB, as these tests keep their `Matter` on the stack
          cargo test --features async-io,large-buffers-4096 --test im_tests --test bdx --test diag_logs
          cargo test -p rs-matter-transport --lib --features large-buffers-4096

      - name: Examples - WebRTC Camera
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo build --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},log,zbus,webrtc

  windows:
    # Builds and tests what only Windows builds, such as the BLE GATT peripheral and central and the Wi-Fi driver.
    # The runner has no radios, so the tests do not reach them.
    runs-on: windows-latest

    steps:
      - name: Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      # The tests compare with files of the repository, which have LF line endings
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clippy - All
        run: cargo clippy --no-deps --all-targets -- -Dwarnings

      # As on Linux, without `zbus` and `bluer`, which are Linux-only
      - name: Clippy - Optional features
        working-directory: rs-matter
        run: cargo clippy --all-targets --no-default-features --features rustcrypto,os,async-io,log,groups,case-resumption,persistent-subscriptions,ota-dcl,qr-scan,pics,backtrace,log-tlv-payload,log-mrp,large-buffers,stack-max-large-im-buffers-4,max-group-keys-per-fabric-2,max-groups-per-fabric-4 -- -Dwarnings

      - name: Clippy - Send Sync
        working-directory: rs-matter
        run: cargo clippy --no-deps --features send-sync -- -Dwarnings

      # Clippy does not compute the layouts of the futures, while a build does, and it also links
      - name: Build - onoff_light_bt
        run: cargo build -p rs-matter-examples --bin onoff_light_bt

      # As on Linux, with the `rustcrypto` backend
      - name: Test
        run: cargo test --workspace --exclude rs-matter-examples --exclude rs-matter-tests --exclude rs-matter-codegen --exclude rs-matter-macros --no-default-features --features rs-matter/rustcrypto,rs-matter/os,rs-matter/async-io,rs-matter/log,rs-matter/groups,rs-matter/case-resumption,rs-matter/persistent-subscriptions,rs-matter/max-group-keys-per-fabric-2,rs-matter/max-groups-per-fabric-4

  miri:
    # Runs the unit tests under Miri, to catch undefined behavior in the `unsafe` code
    # (mostly in `utils`, and in particular in `utils::storage`, and `LockedBySessions` in `node`).
    # The tests that run crypto are left out, as it takes hours under Miri: those of `crypto`,
    # `onboard`, most of `cert`, SPAKE2+ and Check-In in `sc`, and the fabrics and the fail-safe
    # in `node-core`. They contain no `unsafe` of their own.
    runs-on: ubuntu-latest

    steps:
      - name: Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri, rust-src

      - name: Checkout
        uses: actions/checkout@v4

      - name: Miri
        run: |
          cargo miri test --lib -p rs-matter-utils -p rs-matter-tlv -p rs-matter-im-core -p rs-matter-dm
          cargo miri test --lib -p rs-matter-dm-core -- --skip persist::
          cargo miri test --lib -p rs-matter-im
          cargo miri test --lib -p rs-matter-node-core -- acl:: basic_info:: rtc:: networks:: icd:: session:: handover::
          cargo miri test --lib -p rs-matter-transport
          cargo miri test --lib -p rs-matter-sc -- --skip spake2p --skip checkin::
          cargo miri test --lib -p rs-matter-bdx -p rs-matter-pairing
          cargo miri test --lib -p rs-matter-node --features groups
          cargo miri test --lib -p rs-matter-cert -- der_utils::

  fuzz:
    # Runs each fuzz target in `fuzz` for a minute, and for ten minutes in the nightly run,
    # which also runs the targets that use the crypto backend with MbedTLS and OpenSSL.
    # A crash fails the job, which then prints the panic or the report of libFuzzer and
    # uploads the inputs that crashed the targets as the `fuzz-artifacts` artifact.
    runs-on: ubuntu-latest

    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && 600 || 60 }}

    steps:
      - name: Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Checkout
        uses: actions/checkout@v4

      - name: Seed generator
        # It shares the harness of the `node` target, so check that it still builds
        run: cargo check --manifest-path fuzz/seedgen/Cargo.toml

      # The nightly run goes on from the corpus of the previous ones. The other runs start
      # from the seeds only, so that their time does not grow with the corpus.
      - name: Restore corpus
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      # The prebuilt cargo-fuzz is a musl binary, which builds the targets for musl unless
      # told otherwise, and the toolchain has no musl target
      - name: Fuzz
        run: |
          failed=0
          for target in $(cargo fuzz list); do
            # New inputs go to the first directory, so the seeds in `fuzz/seeds` stay as they are
            corpus="fuzz/corpus/$target"
            mkdir -p "$corpus"
            seeds=""
            if [ -d "fuzz/seeds/$target" ]; then
              seeds="fuzz/seeds/$target"
            fi
            if cargo fuzz run --target x86_64-unknown-linux-gnu "$target" "$corpus" $seeds -- -max_total_time=$FUZZ_SECONDS -max_len=4096 -rss_limit_mb=1024 -timeout=10 > fuzz.log 2>&1; then
              echo "$target: $(grep -E '^Done [0-9]+ runs' fuzz.log | tail -1)"
            else
              echo "::error::$target failed"
              # From the panic or the report of libFuzzer on, without the stack trace, which has
              # no symbols; without either, e.g. for a build error, the end of the log
              report=$(awk '/panicked at|ERROR: |ALARM: / { found = 1 } found' fuzz.log | grep -vE '^ +#[0-9]+ 0x' | head -n 100)
              echo "${report:-$(tail -n 40 fuzz.log)}"
              failed=1
            fi
          done
          exit $failed

      # The targets that give data from peers to the crypto backend, with the backends
      # other than RustCrypto, which run code of their own on it
      - name: Fuzz - MbedTLS and OpenSSL
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: |
          failed=0
          for backend in mbedtls openssl; do
            for target in node sc; do
              corpus="fuzz/corpus/$target"
              mkdir -p "$corpus"
              seeds=""
              if [ -d "fuzz/seeds/$target" ]; then
                seeds="fuzz/seeds/$target"
              fi
              if cargo fuzz run --target x86_64-unknown-linux-gnu --features "$backend" "$target" "$corpus" $seeds -- -max_total_time=$FUZZ_SECONDS -max_len=4096 -rss_limit_mb=1024 -timeout=10 > fuzz.log 2>&1; then
                echo "$target with $backend: $(grep -E '^Done [0-9]+ runs' fuzz.log | tail -1)"
              else
                echo "::error::$target with $backend failed"
                report=$(awk '/panicked at|ERROR: |ALARM: / { found = 1 } found' fuzz.log | grep -vE '^ +#[0-9]+ 0x' | head -n 100)
                echo "${report:-$(tail -n 40 fuzz.log)}"
                failed=1
              fi
            done
          done
          exit $failed

      # `cargo +nightly fuzz run <target> <file>` reproduces a crash
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

      # Also when a target failed, as its corpus has the inputs found before the crash
      - name: Save corpus
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
