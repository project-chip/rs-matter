name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "50 6 * * *"
  workflow_dispatch:

# Pushing a new commit to a pull request supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: stable
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crypto-backend: ['rustcrypto', 'mbedtls', 'openssl']
        features: ['', 'alloc', 'os']

    steps:
      - name: Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy, rust-src

      - name: Setup | Rust no-std Riscv32 target
        run: rustup target add riscv32imac-unknown-none-elf

      - name: Setup | Rust no-std Thumbv6 target
        run: rustup target add thumbv6m-none-eabi

      - name: Setup | Rust no-std Thumbv7 target
        run: rustup target add thumbv7em-none-eabi

      - name: Install libdbus
        run: sudo apt-get install -y libdbus-1-dev

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `cargo xtask copyright` walks `git log --follow` per file
          # to derive each header's first/last-edit year span. With the
          # default shallow clone (`fetch-depth: 1`) only the synthetic
          # PR merge commit is reachable, so every file collapses to
          # "today" and the check fails on every PR. `0` = full history.
          fetch-depth: 0

      - name: Fmt
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo fmt -- --check

      - name: Copyright
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo xtask copyright

      - name: Xtask Fmt
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cd xtask; cargo fmt -- --check

      - name: Clippy - All
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo clippy --no-deps --all-targets -- -Dwarnings

      # Also covers the optional features that no other step builds (e.g. `ota-dcl`).
      # The steps of `rs-matter` lint the `rs-matter-*` crates too, as they are its path dependencies.
      - name: Clippy - Optional features
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cd rs-matter; cargo clippy --all-targets --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},async-io,log,groups,case-resumption,persistent-subscriptions,ota-dcl,zbus,bluer,max-group-keys-per-fabric-2,max-groups-per-fabric-4 -- -Dwarnings

      - name: Clippy - baremetal
        if: matrix.features == '' && matrix.crypto-backend == 'rustcrypto'
        run: cd rs-matter; cargo clippy --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},defmt --target riscv32imac-unknown-none-elf -- -Dwarnings

      - name: Clippy
        run: cd rs-matter; cargo clippy --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},log -- -Dwarnings

      - name: Clippy | defmt
        run: export DEFMT_LOG=trace; cd rs-matter; cargo clippy --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},defmt -- -Dwarnings

      - name: Xtask Clippy
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cd xtask; cargo clippy --no-deps -- -Dwarnings

      - name: Build
        run: cd rs-matter; cargo build --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},log

      - name: Benchmark
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cd rs-matter; cargo bench --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},log

      # The tests of all `rs-matter*` crates, with the features of `rs-matter`, which it forwards to them
      - name: Test
        if: matrix.features == 'os'
        run: cargo test --workspace --exclude rs-matter-examples --exclude rs-matter-tests --exclude rs-matter-codegen --exclude rs-matter-macros --no-default-features --features rs-matter/${{matrix.crypto-backend}},rs-matter/${{matrix.features}},rs-matter/async-io,rs-matter/log,rs-matter/groups,rs-matter/case-resumption,rs-matter/persistent-subscriptions,rs-matter/max-group-keys-per-fabric-2,rs-matter/max-groups-per-fabric-4

      - name: Test - Codegen & Macros
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo test -p rs-matter-codegen -p rs-matter-macros

      - name: Examples
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo build --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},log,zbus

      - name: Examples - Send Sync
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo build -p rs-matter-examples --bin onoff_light_work_stealing --bin onoff_light --bin onoff_light_switch --bin ota_requestor --features zbus,send-sync

      - name: Test - Send Sync
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cd rs-matter; cargo test --features send-sync --test send_sync

      - name: Test - Stack Send Sync
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cd rs-matter-stack; cargo test --features send-sync --test drivers

      - name: Examples - WebRTC Camera
        if: matrix.features == 'os' && matrix.crypto-backend == 'rustcrypto'
        run: cargo build --no-default-features --features ${{matrix.crypto-backend}},${{matrix.features}},log,zbus,webrtc

  miri:
    # Runs the unit tests under Miri, to catch undefined behavior in the `unsafe` code
    # (mostly in `utils`, and in particular in `utils::storage`, and `LockedBySessions` in `node`).
    # The tests that run crypto are left out, as it takes hours under Miri: those of `crypto`,
    # `onboard`, most of `cert`, SPAKE2+ and Check-In in `sc`, and the fabrics and the fail-safe
    # in `node-core`. They contain no `unsafe` of their own.
    runs-on: ubuntu-latest

    steps:
      - name: Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri, rust-src

      - name: Checkout
        uses: actions/checkout@v4

      - name: Miri
        run: |
          cargo miri test --lib -p rs-matter-utils -p rs-matter-tlv -p rs-matter-im-core -p rs-matter-dm
          cargo miri test --lib -p rs-matter-dm-core -- --skip persist::
          cargo miri test --lib -p rs-matter-im
          cargo miri test --lib -p rs-matter-node-core -- acl:: basic_info:: rtc:: networks:: icd:: session:: handover::
          cargo miri test --lib -p rs-matter-transport
          cargo miri test --lib -p rs-matter-sc -- --skip spake2p --skip checkin::
          cargo miri test --lib -p rs-matter-bdx -p rs-matter-pairing
          cargo miri test --lib -p rs-matter-node --features groups
          cargo miri test --lib -p rs-matter-cert -- der_utils::
