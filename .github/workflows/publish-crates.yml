name: PublishCrates

# Publishes all rs-matter crates to crates.io in dependency order (see
# `.github/scripts/publish-crates.sh`), then tags the release as
# `v<workspace version>`. `PublishTag` tags a commit by hand.
on:
  workflow_dispatch:
    inputs:
      resume:
        description: "Skip the crates whose version is already on crates.io (to finish a release that stopped part way; run it on the same commit)"
        required: false
        type: boolean
        default: false

env:
  rust_toolchain: stable
  # All crates share the workspace version; the main crate is the natural
  # source of the release version.
  CRATE_NAME: rs-matter

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # `contents: write` is required so the tag step can push the git tag. The
    # default GITHUB_TOKEN is read-only for repos/orgs whose default workflow
    # permissions are "read".
    permissions:
      contents: write
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src
      - name: Build | Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.crates_io_token }}
        run: bash .github/scripts/publish-crates.sh ${{ inputs.resume && '--resume' || '' }}
      - name: Get the release tag
        run: |
          version=$(cargo metadata --format-version=1 --no-deps | jq -r ".packages[] | select(.name == \"${{env.CRATE_NAME}}\") | .version")
          echo "release_tag=v$version" >> $GITHUB_ENV
          echo "release tag: v$version"
      # Fails if the tag already exists on GitHub
      - name: Tag the release
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{env.release_tag}}
          message: "Release ${{env.release_tag}}"
