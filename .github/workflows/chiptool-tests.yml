---
name: ChipTool Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every night at 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      chip_ref:
        description: >-
          Chip repository reference (branch/tag/commit). Leave empty to use
          `CHIP_DEFAULT_GITREF` from `xtask/src/itest/common.rs`, which is the
          pin local runs use. Set this only to test against a different
          revision.
        required: false
        type: string

# Pushing a new commit to a pull request supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  chip_integration_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    # The suites are independent, so they run as parallel jobs: the wall clock
    # of the workflow is then bounded by its slowest leg instead of the sum of
    # all suites. The split follows the measured step durations - the (long)
    # `system` suite is halved along the YAML/Python axis that `cargo xtask
    # itest` already exposes as `--suite system-yaml` / `system-python`, the
    # (long) `light` suite keeps a leg of its own, and everything that runs in
    # single-digit minutes is lumped into one `rest` leg.
    strategy:
      fail-fast: false
      matrix:
        suite: [system-yaml, system-python, light, rest]

    name: chip_integration_tests (${{ matrix.suite }})

    steps:
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy, llvm-tools-preview

      # The test drivers are built with coverage instrumentation, so that the
      # `coverage_report` job below can show which lines the Chip suites reach
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Checkout rs-matter
        uses: actions/checkout@v4

      # Each matrix leg compiles the test drivers on its own runner, so
      # without a cargo cache every leg would pay the full cold build of the
      # rs-matter dependency tree. The cache is keyed per leg (rust-cache
      # includes the matrix values in its key), since the legs build different
      # binaries and feature sets.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            xtask

      - name: Install libdbus
        run: sudo apt-get install -y libdbus-1-dev

      - name: Build xtask
        run: |
          cd xtask; cargo build

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install `./xtask/target/debug/xtask -v s itest-packages`

      - name: Fix unshare permissions
        run: |
            sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

      - name: Enable IPv6 on the runner interface
        # GHA Linux runners have IPv6 enabled in the kernel but no IPv6
        # address assigned to their primary NIC, so any service that
        # publishes an mDNS AAAA record (rs-matter's `system_tests`
        # advertises one when its DUT side has any non-unspecified
        # IPv6 address — see `examples/src/common/mdns.rs::initialize_network`)
        # ends up advertising IPv4 only. TC_SC_4_3 step 10 explicitly
        # asserts at least one AAAA address is resolvable for the
        # device's hostname (`asserts.assert_greater(len(quada_records), 0,
        # …)`), so without an IPv6 on the interface the test fails on
        # any IPv4-only environment regardless of what rs-matter does.
        #
        # Assign a unique-local (RFC 4193) `fd…/64` to the default-route
        # interface — purely for in-host mDNS, never routed off the box.
        run: |
          set -euxo pipefail
          IFACE=$(ip -4 -o route show default | awk '{print $5}' | head -1)
          test -n "${IFACE}"
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=0
          sudo sysctl -w "net.ipv6.conf.${IFACE}.disable_ipv6=0"
          sudo ip -6 addr add fd12:3456:789a::1/64 dev "${IFACE}"
          # `loopback` is always there but we additionally need the test
          # NIC to have a global-scope (or ULA) v6 so `if_addrs` shows it
          # to the DUT — link-local alone wouldn't pair with the IPv4
          # address picker in `initialize_network`.
          ip -6 addr show

      # The cache key must be derivable BEFORE the cached directory exists:
      # hashFiles() over `.build/itest/connectedhomeip/**` evaluates against a
      # not-yet-restored path, comes out empty, and produces one constant key —
      # which is immutable in the actions/cache store, so the very first save
      # is served forever. Once `CHIP_DEFAULT_GITREF` moves past that snapshot,
      # `setup_chip` sees the checkout change on every run, wipes `out/`, and
      # rebuilds chip-tool from scratch (~20 min) without the result ever being
      # saved back. Key on the requested Chip ref instead: it is what actually
      # determines the build contents, and it is known before restore.
      - name: Compute Chip cache key
        id: chip-key
        run: |
          if [ -n "${{ inputs.chip_ref }}" ]; then
            ref="${{ inputs.chip_ref }}"
          else
            ref=$(sed -n 's/^pub const CHIP_DEFAULT_GITREF: &str = "\([^"]*\)".*/\1/p' xtask/src/itest/common.rs)
          fi
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Restore-only: the save is an explicit step at the end of ONE
      # designated leg (see "Save Chip build cache" below). With the implicit
      # post-job save of `actions/cache`, every leg would race to save the
      # (immutable) key, and the fastest leg is precisely the one that builds
      # the least — `system-yaml` would win with a tree lacking
      # `chip-all-clusters-app`, condemning the legs that lazily build it
      # (`system-python` for TC_SC_3_5 / TC_DA_1_9, `rest` for the
      # commissioner suite) to rebuild it on every subsequent run.
      - name: Restore Chip build cache
        uses: actions/cache/restore@v4
        with:
          path: .build/itest/connectedhomeip
          key: chip1-${{ runner.os }}-${{ steps.chip-key.outputs.ref }}
          # On a ref bump, start from the previous ref's cache: the pigweed
          # `.environment` and the clone survive `setup_chip`'s `out/` clean,
          # so only chip-tool itself is rebuilt — and the save then stores
          # the rebuilt tree under the new key.
          restore-keys: |
            chip1-${{ runner.os }}-

      - name: Setup Chip environment
        run: |
          if [ -n "${{ inputs.chip_ref }}" ]; then
            cargo xtask itest-setup --gitref "${{ inputs.chip_ref }}"
          else
            cargo xtask itest-setup
          fi

      - name: Run System YAML integration tests with RustCrypto
        if: matrix.suite == 'system-yaml'
        run: |
          # `tee` so the system_tests stdout/stderr (and the python
          # framework's mDNS browse, PASE traces, etc.) end up both in
          # the live action log AND in a file we upload as an artifact.
          # Without it, a failure half a suite in is harder to diagnose
          # because the relevant lines have already scrolled past the
          # GitHub Actions live tail.
          set -o pipefail
          cargo xtask itest --skip-setup --suite system-yaml --coverage-out /tmp/itest-cov/system-yaml.info \
            2>&1 | tee /tmp/itest-system-yaml.log

      - name: Run System Python integration tests with RustCrypto
        if: matrix.suite == 'system-python'
        run: |
          set -o pipefail
          cargo xtask itest --skip-setup --suite system-python --coverage-out /tmp/itest-cov/system-python.info \
            2>&1 | tee /tmp/itest-system-python.log

      - name: Run one System integration test with MbedTLS
        if: matrix.suite == 'rest'
        run: |
          set -o pipefail
          cargo xtask itest --skip-setup --features mbedtls TestBasicInformation --coverage-out /tmp/itest-cov/mbedtls.info \
            2>&1 | tee /tmp/itest-system-mbedtls.log

      - name: Run one System integration test with OpenSSL
        if: matrix.suite == 'rest'
        run: |
          set -o pipefail
          cargo xtask itest --skip-setup --features openssl TestBasicInformation --coverage-out /tmp/itest-cov/openssl.info \
            2>&1 | tee /tmp/itest-system-openssl.log

      - name: Run Wireless Network Commissioning integration tests
        if: matrix.suite == 'rest'
        run: |
          set -o pipefail
          cargo xtask itest --skip-setup --suite wireless --coverage-out /tmp/itest-cov/wireless.info \
            2>&1 | tee /tmp/itest-wireless.log

      - name: Run BLE commissioning integration tests
        if: matrix.suite == 'rest'
        run: |
          set -o pipefail
          cargo xtask itest --skip-setup --suite ble --coverage-out /tmp/itest-cov/ble.info \
            2>&1 | tee /tmp/itest-ble.log

      # Real Thread stack (`otbr-agent` over D-Bus) on OpenThread's simulated
      # radio - no hardware involved. `otbr-agent` runs unprivileged via file
      # capabilities, granted by the suite through the runner's passwordless
      # sudo (`sudo -n setcap`).
      - name: Run Thread integration tests
        if: matrix.suite == 'rest'
        run: |
          set -o pipefail
          cargo xtask itest --skip-setup --suite thread --coverage-out /tmp/itest-cov/thread.info \
            2>&1 | tee /tmp/itest-thread.log

      - name: Run LevelControl and OnOff integration tests
        if: matrix.suite == 'light'
        run: |
          set -o pipefail
          cargo xtask itest --skip-setup --suite light --coverage-out /tmp/itest-cov/light.info \
            2>&1 | tee /tmp/itest-light.log

      - name: Run Scenes integration tests
        if: matrix.suite == 'rest'
        run: |
          set -o pipefail
          cargo xtask itest --skip-setup --suite scenes --coverage-out /tmp/itest-cov/scenes.info \
            2>&1 | tee /tmp/itest-scenes.log

      - name: Run Camera integration tests
        if: matrix.suite == 'rest'
        run: |
          set -o pipefail
          cargo xtask itest --skip-setup --suite camera --coverage-out /tmp/itest-cov/camera.info \
            2>&1 | tee /tmp/itest-camera.log

      - name: Run Commissioner integration tests
        if: matrix.suite == 'rest'
        run: |
          set -o pipefail
          cargo xtask itest --skip-setup --suite commissioner --coverage-out /tmp/itest-cov/commissioner.info \
            2>&1 | tee /tmp/itest-commissioner.log

      # The designated cache saver: `system-python` is the leg whose lazy
      # builds make the cached tree complete (it builds
      # `chip-all-clusters-app` during its test run). `always()` so a test
      # failure doesn't discard a perfectly good chip build; if the exact key
      # already exists, the save skips gracefully.
      - name: Save Chip build cache
        if: always() && matrix.suite == 'system-python'
        uses: actions/cache/save@v4
        with:
          path: .build/itest/connectedhomeip
          key: chip1-${{ runner.os }}-${{ steps.chip-key.outputs.ref }}

      - name: Upload coverage traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itest-coverage-${{ matrix.suite }}
          path: /tmp/itest-cov/*.info
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ matrix.suite }}
          # `/tmp/matter_testing/logs/` is where the python `MatterBaseTest`
          # framework drops one directory per run, each containing
          # `test_log.DEBUG` (the mDNS browse dumps and per-step
          # transitions live there), `test_log.INFO` and
          # `test_summary.yaml`. The `/tmp/itest-*.log` files are the
          # captured stdout/stderr of each `cargo xtask itest` step.
          # `/tmp/chip_kvs` is `system_tests`' on-disk persistence
          # snapshot at the time the failing test exited — useful for
          # spotting unexpected fabric / commissioning state.
          path: |
            /tmp/matter_testing/logs/**
            /tmp/itest-*.log
            /tmp/chip_kvs
          retention-days: 7
          if-no-files-found: warn

  # Line coverage of the host test suites (unit, doc and e2e tests) next to
  # the Chip suites' traces from the legs above, and their union. Nightly, so
  # that the test modules (`#[cfg_attr(coverage_nightly, coverage(off))]`) stay
  # out of the host figures. Informational only: nothing here fails the build.
  coverage_report:
    name: coverage report
    needs: chip_integration_tests
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      # Generated D-Bus proxies and the Linux OS backends (Avahi, BlueZ,
      # NetworkManager, wpa_supplicant, OTBR) only run against real system
      # services and are left out of the host measurement. The Chip legs keep
      # the BlueZ and OTBR backends, which the `ble` and `thread` suites reach.
      COV_IGNORE: 'zbus_proxies|mdns/(avahi|zeroconf|astro)|gatt/(bluez|bluer)|wifi/(nm|wpa_supp)|thread/otbr|networks/(unix|eth)'
      COV_FEATURES: rustcrypto,os,async-io,log,groups,case-resumption,persistent-subscriptions,max-group-keys-per-fabric-2,max-groups-per-fabric-4

    steps:
      - name: Checkout rs-matter
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install libdbus
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            xtask
          key: llvm-cov

      - name: Measure the host test suites
        run: |
          mkdir -p /tmp/coverage
          cd rs-matter
          cargo llvm-cov --doctests --no-default-features --features "$COV_FEATURES" \
            --ignore-filename-regex "$COV_IGNORE" \
            --lcov --output-path /tmp/coverage/own.info

      - name: Download the Chip suite traces
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: itest-coverage-*
          path: /tmp/itest-cov
          merge-multiple: true

      - name: Report
        run: |
          shopt -s nullglob
          legs=(/tmp/itest-cov/*.info)
          if [ ${#legs[@]} -gt 0 ]; then
            cargo xtask coverage --merge-out /tmp/coverage/chip.info "${legs[@]}" > /dev/null
            traces=(--names own,chip /tmp/coverage/own.info /tmp/coverage/chip.info)
          else
            echo "::warning::no Chip suite traces were produced; reporting the host suites only"
            traces=(--names own /tmp/coverage/own.info)
          fi
          cargo xtask coverage --depth 1 --split-above 2000 --lowest 20 \
            --merge-out /tmp/coverage/all.info "${traces[@]}"
          {
            echo "## Line coverage by module: host suites (own), Chip suites (chip), union (all)"
            echo
            cargo xtask coverage --depth 1 --split-above 2000 --markdown "${traces[@]}"
            echo
            echo "<details><summary>Lowest-covered files (union)</summary>"
            echo
            echo '```'
            cargo xtask coverage --depth 0 --lowest 20 /tmp/coverage/all.info
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage traces
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: /tmp/coverage/*.info
          retention-days: 14
