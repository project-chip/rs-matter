name: Coverage

# Line coverage of the `rs-matter` unit and internal e2e suites, measured with
# `cargo llvm-cov` on the same feature set as the `os` leg of the CI test job.
#
# The numbers are informational: nothing here fails the build. The per-module
# table lands in the job summary and the full LCOV trace plus an HTML report
# are attached as artifacts. The CHIP certification suites (chiptool-tests.yml)
# are not instrumented, so the cluster handlers they exercise read low here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Generated D-Bus proxies and the Linux OS backends (Avahi, BlueZ, NetworkManager,
  # wpa_supplicant, OTBR) only run against real system services and are excluded.
  COV_IGNORE: 'zbus_proxies|mdns/(avahi|zeroconf|astro)|gatt/(bluez|bluer)|wifi/(nm|wpa_supp)|thread/otbr|networks/(unix|eth)'
  COV_FEATURES: rustcrypto,os,async-io,log,groups,case-resumption,persistent-subscriptions,max-group-keys-per-fabric-2,max-groups-per-fabric-4

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install libdbus
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: llvm-cov

      - name: Measure
        run: |
          cd rs-matter
          cargo llvm-cov --no-default-features --features "$COV_FEATURES" \
            --ignore-filename-regex "$COV_IGNORE" \
            --lcov --output-path ../target/lcov.info
          cargo llvm-cov report --ignore-filename-regex "$COV_IGNORE" \
            --html --output-dir ../target/llvm-cov-html

      - name: Summary
        run: |
          {
            echo "## Line coverage by module"
            echo
            cargo xtask coverage --depth 1 --split-above 2000 --markdown target/lcov.info
            echo
            echo "<details><summary>Lowest-covered files</summary>"
            echo
            echo '```'
            cargo xtask coverage --depth 0 --lowest 20 target/lcov.info
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            target/lcov.info
            target/llvm-cov-html
          retention-days: 14

      # To publish to Codecov (badge, per-PR patch coverage comment), add the
      # repository token as the CODECOV_TOKEN secret and enable this step.
      # - name: Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: target/lcov.info
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     fail_ci_if_error: false
