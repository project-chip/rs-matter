[package]
name = "backend-mc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ws-protocol::Backend implementation on the third-party matter-controller crate (PLAN.md T4, the fast path to backend-rsm)"

[dependencies]
ws-protocol = { path = "../ws-protocol" }
# Pinned to the same versions matter-rs/Cargo.toml (the prototype this crate ports) uses, per
# PLAN.md T4 -- verified to build offline against the registry cache on this machine.
matter-controller = "0.11"
matter-codec = "0.3"
# Not a matter-controller dependency of ours transitively re-exported: matter-controller keeps
# the fabric's root signing key fully internal (no public accessor), so deriving our own
# spec-correct compressed_fabric_id (Matter Core Spec 4.3.2.2) needs this crate directly -- see
# `fabric_identity.rs`.
matter-crypto = "0.3"
# Only used for `matter_commissioning::setup::{encode_manual_code, Discriminator, Passcode,
# SetupPayload, ...}` -- delegating to the exact Verhoeff/packing implementation the rest of the
# stack already trusts, rather than re-deriving it, per `manual_code.rs`.
matter-commissioning = "0.7"
mdns-sd = "0.13"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt"] }
