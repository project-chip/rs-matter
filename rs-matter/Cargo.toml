[package]
name = "rs-matter"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["os", "rustcrypto", "log"]

# Sizing

# Number of fabrics.
max-fabrics-32 = ["rs-matter-node-core/max-fabrics-32"]
max-fabrics-16 = ["rs-matter-node-core/max-fabrics-16"]
max-fabrics-8 = ["rs-matter-node-core/max-fabrics-8"]
max-fabrics-7 = ["rs-matter-node-core/max-fabrics-7"]
max-fabrics-6 = ["rs-matter-node-core/max-fabrics-6"]
# Default number of fabrics (Matter requires a minimum of 5 fabrics).
max-fabrics-5 = ["rs-matter-node-core/max-fabrics-5"]
max-fabrics-4 = ["rs-matter-node-core/max-fabrics-4"]
max-fabrics-3 = ["rs-matter-node-core/max-fabrics-3"]
max-fabrics-2 = ["rs-matter-node-core/max-fabrics-2"]
max-fabrics-1 = ["rs-matter-node-core/max-fabrics-1"]

# Number of groups per fabrics.
max-groups-per-fabric-32 = ["rs-matter-node-core/max-groups-per-fabric-32"]
max-groups-per-fabric-16 = ["rs-matter-node-core/max-groups-per-fabric-16"]
max-groups-per-fabric-12 = ["rs-matter-node-core/max-groups-per-fabric-12"]
max-groups-per-fabric-8 = ["rs-matter-node-core/max-groups-per-fabric-8"]
max-groups-per-fabric-7 = ["rs-matter-node-core/max-groups-per-fabric-7"]
max-groups-per-fabric-6 = ["rs-matter-node-core/max-groups-per-fabric-6"]
max-groups-per-fabric-5 = ["rs-matter-node-core/max-groups-per-fabric-5"]
# Default number of groups per fabric (Matter requires a minimum of 4 group table entries per fabric).
max-groups-per-fabric-4 = ["rs-matter-node-core/max-groups-per-fabric-4"]

# Number of group keys per fabric.
max-group-keys-per-fabric-5 = ["rs-matter-node-core/max-group-keys-per-fabric-5"]
max-group-keys-per-fabric-4 = ["rs-matter-node-core/max-group-keys-per-fabric-4"]
# Default number of group keys per fabric (Matter requires a minimum of 1 group keys per fabric).
max-group-keys-per-fabric-3 = ["rs-matter-node-core/max-group-keys-per-fabric-3"]
max-group-keys-per-fabric-2 = ["rs-matter-node-core/max-group-keys-per-fabric-2"]

# Number of endpoints that can be members of a group (per fabric).
max-group-endpoints-per-fabric-5 = ["rs-matter-node-core/max-group-endpoints-per-fabric-5"]
max-group-endpoints-per-fabric-4 = ["rs-matter-node-core/max-group-endpoints-per-fabric-4"]
# Default number of endpoints that can be members of a group (per fabric).
max-group-endpoints-per-fabric-3 = ["rs-matter-node-core/max-group-endpoints-per-fabric-3"]
max-group-endpoints-per-fabric-2 = ["rs-matter-node-core/max-group-endpoints-per-fabric-2"]
max-group-endpoints-per-fabric-1 = ["rs-matter-node-core/max-group-endpoints-per-fabric-1"]

# Number of subscriptions of `rs-matter-stack`.
stack-max-subscriptions-32 = ["rs-matter-stack/max-subscriptions-32"]
stack-max-subscriptions-16 = ["rs-matter-stack/max-subscriptions-16"]
stack-max-subscriptions-8 = ["rs-matter-stack/max-subscriptions-8"]
stack-max-subscriptions-7 = ["rs-matter-stack/max-subscriptions-7"]
stack-max-subscriptions-6 = ["rs-matter-stack/max-subscriptions-6"]
stack-max-subscriptions-5 = ["rs-matter-stack/max-subscriptions-5"]
stack-max-subscriptions-4 = ["rs-matter-stack/max-subscriptions-4"]
stack-max-subscriptions-3 = ["rs-matter-stack/max-subscriptions-3"]
stack-max-subscriptions-2 = ["rs-matter-stack/max-subscriptions-2"]
stack-max-subscriptions-1 = ["rs-matter-stack/max-subscriptions-1"]

# Size of the events ring buffer of `rs-matter-stack`.
stack-events-ringbuf-size-2048 = ["rs-matter-stack/events-ringbuf-size-2048"]
stack-events-ringbuf-size-1024 = ["rs-matter-stack/events-ringbuf-size-1024"]
stack-events-ringbuf-size-512 = ["rs-matter-stack/events-ringbuf-size-512"]
stack-events-ringbuf-size-256 = ["rs-matter-stack/events-ringbuf-size-256"]
stack-events-ringbuf-size-128 = ["rs-matter-stack/events-ringbuf-size-128"]
stack-events-ringbuf-size-64 = ["rs-matter-stack/events-ringbuf-size-64"]
stack-events-ringbuf-size-0 = ["rs-matter-stack/events-ringbuf-size-0"]

# Number of IM buffers of `rs-matter-stack`.
stack-max-im-buffers-64 = ["rs-matter-stack/max-im-buffers-64"]
stack-max-im-buffers-32 = ["rs-matter-stack/max-im-buffers-32"]
stack-max-im-buffers-16 = ["rs-matter-stack/max-im-buffers-16"]
stack-max-im-buffers-10 = ["rs-matter-stack/max-im-buffers-10"]
stack-max-im-buffers-9 = ["rs-matter-stack/max-im-buffers-9"]
stack-max-im-buffers-8 = ["rs-matter-stack/max-im-buffers-8"]
stack-max-im-buffers-7 = ["rs-matter-stack/max-im-buffers-7"]
stack-max-im-buffers-6 = ["rs-matter-stack/max-im-buffers-6"]
stack-max-im-buffers-5 = ["rs-matter-stack/max-im-buffers-5"]
stack-max-im-buffers-4 = ["rs-matter-stack/max-im-buffers-4"]

# Number of concurrent responders of `rs-matter-stack`.
stack-max-responders-32 = ["rs-matter-stack/max-responders-32"]
stack-max-responders-16 = ["rs-matter-stack/max-responders-16"]
stack-max-responders-8 = ["rs-matter-stack/max-responders-8"]
stack-max-responders-7 = ["rs-matter-stack/max-responders-7"]
stack-max-responders-6 = ["rs-matter-stack/max-responders-6"]
stack-max-responders-5 = ["rs-matter-stack/max-responders-5"]
stack-max-responders-4 = ["rs-matter-stack/max-responders-4"]
stack-max-responders-3 = ["rs-matter-stack/max-responders-3"]
stack-max-responders-2 = ["rs-matter-stack/max-responders-2"]
stack-max-responders-1 = ["rs-matter-stack/max-responders-1"]

# Number of ACL entries per fabric.
max-acls-per-fabric-32 = ["rs-matter-node-core/max-acls-per-fabric-32"]
max-acls-per-fabric-16 = ["rs-matter-node-core/max-acls-per-fabric-16"]
max-acls-per-fabric-8 = ["rs-matter-node-core/max-acls-per-fabric-8"]
max-acls-per-fabric-7 = ["rs-matter-node-core/max-acls-per-fabric-7"]
max-acls-per-fabric-6 = ["rs-matter-node-core/max-acls-per-fabric-6"]
max-acls-per-fabric-5 = ["rs-matter-node-core/max-acls-per-fabric-5"]
# Default number of ACL entries per fabric (Matter requires a minimum of 3 ACL entries per fabric).
max-acls-per-fabric-4 = ["rs-matter-node-core/max-acls-per-fabric-4"]
max-acls-per-fabric-3 = ["rs-matter-node-core/max-acls-per-fabric-3"]
max-acls-per-fabric-2 = ["rs-matter-node-core/max-acls-per-fabric-2"]
max-acls-per-fabric-1 = ["rs-matter-node-core/max-acls-per-fabric-1"]

# Number of subjects per ACL entry.
max-subjects-per-acl-32 = ["rs-matter-node-core/max-subjects-per-acl-32"]
max-subjects-per-acl-16 = ["rs-matter-node-core/max-subjects-per-acl-16"]
max-subjects-per-acl-8 = ["rs-matter-node-core/max-subjects-per-acl-8"]
max-subjects-per-acl-7 = ["rs-matter-node-core/max-subjects-per-acl-7"]
max-subjects-per-acl-6 = ["rs-matter-node-core/max-subjects-per-acl-6"]
max-subjects-per-acl-5 = ["rs-matter-node-core/max-subjects-per-acl-5"]
# Default number of subjects per ACL entry (Matter requires a minimum of 4 subjects per ACL entry).
max-subjects-per-acl-4 = ["rs-matter-node-core/max-subjects-per-acl-4"]
max-subjects-per-acl-3 = ["rs-matter-node-core/max-subjects-per-acl-3"]
max-subjects-per-acl-2 = ["rs-matter-node-core/max-subjects-per-acl-2"]
max-subjects-per-acl-1 = ["rs-matter-node-core/max-subjects-per-acl-1"]

# Number of targets per ACL entry.
max-targets-per-acl-32 = ["rs-matter-node-core/max-targets-per-acl-32"]
max-targets-per-acl-16 = ["rs-matter-node-core/max-targets-per-acl-16"]
max-targets-per-acl-8 = ["rs-matter-node-core/max-targets-per-acl-8"]
max-targets-per-acl-7 = ["rs-matter-node-core/max-targets-per-acl-7"]
max-targets-per-acl-6 = ["rs-matter-node-core/max-targets-per-acl-6"]
max-targets-per-acl-5 = ["rs-matter-node-core/max-targets-per-acl-5"]
max-targets-per-acl-4 = ["rs-matter-node-core/max-targets-per-acl-4"]
# Default number of targets per ACL entry (Matter requires a minimum of 3 targets per ACL entry).
max-targets-per-acl-3 = ["rs-matter-node-core/max-targets-per-acl-3"]
max-targets-per-acl-2 = ["rs-matter-node-core/max-targets-per-acl-2"]
max-targets-per-acl-1 = ["rs-matter-node-core/max-targets-per-acl-1"]

# Number of sessions.
max-sessions-64 = ["rs-matter-node-core/max-sessions-64"]
max-sessions-32 = ["rs-matter-node-core/max-sessions-32"]
# Default number of sessions (Matter requires a minimum of 3 sessions per fabric).
max-sessions-16 = ["rs-matter-node-core/max-sessions-16"]
max-sessions-8 = ["rs-matter-node-core/max-sessions-8"]
max-sessions-7 = ["rs-matter-node-core/max-sessions-7"]
max-sessions-6 = ["rs-matter-node-core/max-sessions-6"]
max-sessions-5 = ["rs-matter-node-core/max-sessions-5"]
max-sessions-4 = ["rs-matter-node-core/max-sessions-4"]
max-sessions-3 = ["rs-matter-node-core/max-sessions-3"]

# Number of exchanges per session.
max-exchanges-per-session-16 = ["rs-matter-transport/max-exchanges-per-session-16"]
max-exchanges-per-session-8 = ["rs-matter-transport/max-exchanges-per-session-8"]
max-exchanges-per-session-7 = ["rs-matter-transport/max-exchanges-per-session-7"]
max-exchanges-per-session-6 = ["rs-matter-transport/max-exchanges-per-session-6"]
# Default number of exchanges per session (Matter requires a minimum of 5 exchanges per session).
max-exchanges-per-session-5 = ["rs-matter-transport/max-exchanges-per-session-5"]
max-exchanges-per-session-4 = ["rs-matter-transport/max-exchanges-per-session-4"]
max-exchanges-per-session-3 = ["rs-matter-transport/max-exchanges-per-session-3"]

# Number of BTP sessions.
max-btp-sessions-8 = ["rs-matter-transport/max-btp-sessions-8"]
max-btp-sessions-4 = ["rs-matter-transport/max-btp-sessions-4"]
max-btp-sessions-2 = ["rs-matter-transport/max-btp-sessions-2"]
# Default number of BTP sessions (Matter accessories typically need just 1 BTP session).
max-btp-sessions-1 = ["rs-matter-transport/max-btp-sessions-1"]

# Number of candidate peer addresses kept per mDNS resolve, for CASE failover.
max-resolve-candidates-8 = ["rs-matter-transport/max-resolve-candidates-8"]
max-resolve-candidates-6 = ["rs-matter-transport/max-resolve-candidates-6"]
max-resolve-candidates-5 = ["rs-matter-transport/max-resolve-candidates-5"]
# Default number of resolve candidates: enough to hold the largest address set a
# conformant peer can advertise on Wi-Fi / Ethernet - its link-local address plus
# the three routable ones the Matter Core Specification requires it to support.
max-resolve-candidates-4 = ["rs-matter-transport/max-resolve-candidates-4"]
max-resolve-candidates-3 = ["rs-matter-transport/max-resolve-candidates-3"]
max-resolve-candidates-2 = ["rs-matter-transport/max-resolve-candidates-2"]
# No failover: only the best-scored address is ever tried.
max-resolve-candidates-1 = ["rs-matter-transport/max-resolve-candidates-1"]

# Size (in bytes) of the key-value persistence scratch buffer owned by `Matter`.
kv-blob-store-65536 = ["rs-matter-dm-core/kv-blob-store-65536"]
kv-blob-store-32768 = ["rs-matter-dm-core/kv-blob-store-32768"]
kv-blob-store-16384 = ["rs-matter-dm-core/kv-blob-store-16384"]
kv-blob-store-8192 = ["rs-matter-dm-core/kv-blob-store-8192"]
# Default key-value persistence scratch buffer size.
kv-blob-store-4096 = ["rs-matter-dm-core/kv-blob-store-4096"]
kv-blob-store-2048 = ["rs-matter-dm-core/kv-blob-store-2048"]
kv-blob-store-1024 = ["rs-matter-dm-core/kv-blob-store-1024"]

# General

# mDNS support for MacOSX.
astro-dnssd = ["os", "rs-matter-transport/astro-dnssd", "rs-matter-stack/astro-dnssd"]
# mDNS support for Linux and Windows (via Avahi or Bonjour).
# Prefer the Avahi and Resolved mDNS implementations over Zeroconf for production deployments, via `zbus`.
zeroconf = ["os", "rs-matter-transport/zeroconf", "rs-matter-stack/zeroconf"]
# Enable the zBus proxies for a range of Linux dBus services used by `rs-matter` (off by default due to slow compilation).
zbus = ["os", "rs-matter-utils/zbus", "rs-matter-transport/zbus", "rs-matter-dm/zbus", "rs-matter-stack/zbus"]
# BLE suppport for Linux (via BlueZ).
# Prefer the BlueZ implementation over Bluer for production deployments, via `zbus`.
bluer = ["os", "rs-matter-utils/bluer", "rs-matter-transport/bluer", "rs-matter-stack/bluer"]
# Recognizing Matter onboarding QR codes in images (via `rqrr`), for commissioners
# that scan a device's QR code rather than being handed its payload text.
# Requires `std`; the image *decoding* (PNG/JPEG/camera/...) is the caller's job -
# this only consumes 8-bit greyscale pixels. See `pairing::qr::scan`.
qr-scan = ["std", "rs-matter-pairing/qr-scan"]

# Emit the data model as JSON (`Matter::write_pics_json`), for deriving a PICS
# declaration from what the device actually implements rather than by hand.
# Rendering goes through `core::fmt` and allocates nothing; consumed by
# `cargo xtask pics`. See `docs/pics-generation-design.md`.
pics = ["rs-matter-node/pics"]
# Umbrella set of features for typical OS-based non-baremetal deployments.
os = ["std", "async-io", "rs-matter-utils/os", "rs-matter-node-core/os", "rs-matter-transport/os", "rs-matter-node/os", "rs-matter-dm/os"]
# Minimal set of features for targets with support for Rust STD (narrower than `os` above).
std = ["alloc", "rs-matter-utils/std", "rs-matter-tlv/std", "rs-matter-crypto/std", "rs-matter-cert/std", "rs-matter-pairing/std", "rs-matter-im-core/std", "rs-matter-dm-core/std", "rs-matter-dm-clusters/std", "rs-matter-node-core/std", "rs-matter-transport/std", "rs-matter-node/std", "rs-matter-sc/std", "rs-matter-bdx/std", "rs-matter-im/std", "rs-matter-dm/std", "rs-matter-respond/std", "rs-matter-onboard/std", "rs-matter-stack/std"]
# Enable backtrace capturing (useful for debugging).
backtrace = ["rs-matter-utils/backtrace"]
# Enable the alloc feature for targets that support it.
# In general, `rs-matter` does not use heap, so this feature enables only a few convenience features.
alloc = ["defmt?/alloc", "rs-matter-utils/alloc", "rs-matter-tlv/alloc", "rs-matter-crypto/alloc", "rs-matter-cert/alloc", "rs-matter-pairing/alloc", "rs-matter-im-core/alloc", "rs-matter-dm-core/alloc", "rs-matter-dm-clusters/alloc", "rs-matter-node-core/alloc", "rs-matter-transport/alloc", "rs-matter-node/alloc", "rs-matter-sc/alloc", "rs-matter-bdx/alloc", "rs-matter-im/alloc", "rs-matter-dm/alloc", "rs-matter-respond/alloc", "rs-matter-onboard/alloc", "rs-matter-stack/alloc"]
# Crypto backend: Rust Crypto.
rustcrypto = ["alloc", "rs-matter-crypto/rustcrypto"]
# Crypto backend: OpenSSL (not usable for baremetal targets, only for OS targets with OpenSSL installed).
openssl = ["alloc", "rs-matter-crypto/openssl"]
# Crypto backend: mbedTLS.
mbedtls = ["alloc", "rs-matter-crypto/mbedtls"]
# Build `rs-matter` with support for work-stealing executors, like the default Tokio executor.
# This is a WIP feature and not yet fully supported.
send-sync = ["rs-matter-utils/send-sync", "rs-matter-stack/send-sync"]
# Enable a small OTA DCL client.
# TODO: We likely don't need this hidden behind a feature.
ota-dcl = ["rs-matter-dm/ota-dcl"]
# Enable support for `defmt` logging (for embedded targets).
defmt = ["dep:defmt", "rs-matter-utils/defmt", "rs-matter-tlv/defmt", "rs-matter-crypto/defmt", "rs-matter-cert/defmt", "rs-matter-pairing/defmt", "rs-matter-im-core/defmt", "rs-matter-dm-core/defmt", "rs-matter-dm-clusters/defmt", "rs-matter-node-core/defmt", "rs-matter-transport/defmt", "rs-matter-node/defmt", "rs-matter-sc/defmt", "rs-matter-bdx/defmt", "rs-matter-im/defmt", "rs-matter-dm/defmt", "rs-matter-respond/defmt", "rs-matter-onboard/defmt", "rs-matter-stack/defmt"]
# Enable support for `log` logging (for embedded and OS targets).
log = ["dep:log", "rs-matter-utils/log", "rs-matter-tlv/log", "rs-matter-crypto/log", "rs-matter-cert/log", "rs-matter-pairing/log", "rs-matter-im-core/log", "rs-matter-dm-core/log", "rs-matter-dm-clusters/log", "rs-matter-node-core/log", "rs-matter-transport/log", "rs-matter-node/log", "rs-matter-sc/log", "rs-matter-bdx/log", "rs-matter-im/log", "rs-matter-dm/log", "rs-matter-respond/log", "rs-matter-onboard/log", "rs-matter-stack/log"]
# Enable `debug`-level logging of TLV payloads.
# This is very verbose and should only be used for debugging.
log-tlv-payload = ["rs-matter-transport/log-tlv-payload"]
# Promote MRP-diagnostic logs from `debug` to `warn` so they are visible under a typical `info`-level filter.
log-mrp = ["rs-matter-transport/log-mrp"]
# Typically enabled when TCP is used.
# When enabled, this feature extends the Transport layer packet buffers, as well as the ones
# served by `MatterBuffers` to 1MB (from 1500 B).
large-buffers = ["rs-matter-dm-core/large-buffers", "rs-matter-transport/large-buffers"]
# Multicast groups support.
groups = ["rs-matter-crypto/groups", "rs-matter-node-core/groups", "rs-matter-transport/groups", "rs-matter-node/groups", "rs-matter-sc/groups", "rs-matter-im/groups", "rs-matter-dm/groups"]
# Persist accepted subscriptions and resume them across a reboot.
persistent-subscriptions = ["rs-matter-im/persistent-subscriptions"]
# CASE session resumption (Sigma2-Resume fast-path + its persisted cache).
# When off, CASE always runs the full Sigma1/2/3 handshake, which is spec-compliant (resumption is optional) and drops the resume crypto + cache from the build.
case-resumption = ["rs-matter-transport/case-resumption", "rs-matter-node/case-resumption", "rs-matter-sc/case-resumption", "rs-matter-dm/case-resumption"]
# Never initiate a new CASE session: `Exchange::initiate` only reuses an existing session (else fails), so the linker drops the CASE initiator + mDNS resolver.
# Suits a pure accessory that only reports over sessions its peers established.
case-responder-only = ["rs-matter-transport/case-responder-only", "rs-matter-sc/case-responder-only"]
# The `async-io` adapters of the network traits.
async-io = ["rs-matter-transport/async-io", "rs-matter-stack/async-io"]

[dependencies]
rs-matter-utils = { workspace = true }
rs-matter-tlv = { workspace = true }
rs-matter-crypto = { workspace = true }
rs-matter-cert = { workspace = true }
rs-matter-pairing = { workspace = true }
rs-matter-im-core = { workspace = true }
rs-matter-dm-core = { workspace = true }
rs-matter-dm-clusters = { workspace = true }
rs-matter-node-core = { workspace = true }
rs-matter-transport = { workspace = true }
rs-matter-node = { workspace = true }
rs-matter-sc = { workspace = true }
rs-matter-bdx = { workspace = true }
rs-matter-im = { workspace = true }
rs-matter-dm = { workspace = true }
rs-matter-respond = { workspace = true }
rs-matter-onboard = { workspace = true }
rs-matter-stack = { workspace = true }
bitflags = { workspace = true }
strum = { workspace = true }
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
log = { workspace = true }
embassy-sync = { workspace = true }
rand_core = { workspace = true }
num = { workspace = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
env_logger = { workspace = true }
nix = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
futures-lite = { workspace = true }
async-channel = { workspace = true }
static_cell = { workspace = true }
similar = { workspace = true }
embassy-time-queue-utils = { workspace = true, features = ["generic-queue-64"] }
trybuild = { workspace = true }
tempfile = { workspace = true }
async-io = { workspace = true }

# The MCSP end-to-end test provisions a fabric with a live group key
# set + key map; those tables collapse to zero-length under this crate's
# default (feature-driven) sizing. Enable the smallest group-keys/map
# features that give it room to run.
[[test]]
name = "mcsp"
required-features = ["async-io", "groups", "max-group-keys-per-fabric-2", "max-groups-per-fabric-4"]

# Checks that the futures of a node are `Send`, which they are only with `send-sync`.
[[test]]
name = "send_sync"
required-features = ["send-sync", "os"]

[lints.rust]
# `cargo llvm-cov` sets these when measuring coverage (the second one only on nightly)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }
