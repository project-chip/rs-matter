[package]
name = "rs-matter-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Native Rust implementation of the Matter (Smart-Home) ecosystem - the node: the Matter object"
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["os", "log"]
# Umbrella set of features for typical OS-based non-baremetal deployments.
os = ["std", "rs-matter-utils/backtrace", "rs-matter-utils/os", "rs-matter-node-core/os", "rs-matter-transport/os"]
std = ["alloc", "rs-matter-utils/std", "rs-matter-tlv/std", "rs-matter-crypto/std", "rs-matter-cert/std", "rs-matter-pairing/std", "rs-matter-im-core/std", "rs-matter-dm-core/std", "rs-matter-node-core/std", "rs-matter-transport/std", "rs-matter-sc/std"]
alloc = ["defmt?/alloc", "rs-matter-utils/alloc", "rs-matter-tlv/alloc", "rs-matter-crypto/alloc", "rs-matter-cert/alloc", "rs-matter-pairing/alloc", "rs-matter-im-core/alloc", "rs-matter-dm-core/alloc", "rs-matter-node-core/alloc", "rs-matter-transport/alloc", "rs-matter-sc/alloc"]
# Multicast groups support.
groups = ["rs-matter-crypto/groups", "rs-matter-node-core/groups", "rs-matter-transport/groups", "rs-matter-sc/groups"]
# CASE session resumption (Sigma2-Resume fast-path + its persisted cache).
case-resumption = ["rs-matter-transport/case-resumption", "rs-matter-sc/case-resumption"]
# Emit the data model as JSON (`Matter::write_pics_json`), for deriving a PICS
# declaration from what the device actually implements rather than by hand.
pics = []
defmt = ["dep:defmt", "rs-matter-utils/defmt", "rs-matter-tlv/defmt", "rs-matter-crypto/defmt", "rs-matter-cert/defmt", "rs-matter-pairing/defmt", "rs-matter-im-core/defmt", "rs-matter-dm-core/defmt", "rs-matter-node-core/defmt", "rs-matter-transport/defmt", "rs-matter-sc/defmt"]
log = ["dep:log", "rs-matter-utils/log", "rs-matter-tlv/log", "rs-matter-crypto/log", "rs-matter-cert/log", "rs-matter-pairing/log", "rs-matter-im-core/log", "rs-matter-dm-core/log", "rs-matter-node-core/log", "rs-matter-transport/log", "rs-matter-sc/log"]

[dependencies]
rs-matter-utils = { workspace = true }
rs-matter-tlv = { workspace = true }
rs-matter-crypto = { workspace = true }
rs-matter-cert = { workspace = true }
rs-matter-pairing = { workspace = true }
rs-matter-im-core = { workspace = true }
rs-matter-dm-core = { workspace = true }
rs-matter-node-core = { workspace = true }
rs-matter-transport = { workspace = true }
rs-matter-sc = { workspace = true }
rand_core = { workspace = true }
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
rs-matter-crypto = { workspace = true, features = ["rustcrypto"] }
# For the Identify cluster metadata in the test of `pics`
rs-matter-dm-clusters = { workspace = true }
embassy-time-queue-utils = { workspace = true, features = ["generic-queue-64"] }

[lints.rust]
# `cargo llvm-cov` sets these when measuring coverage (the second one only on nightly)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }
