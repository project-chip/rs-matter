[package]
name = "rs-matter-codegen"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Native Rust implementation of the Matter (Smart-Home) ecosystem - IDL parser and code generation"
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
quote = { workspace = true }
proc-macro2 = { workspace = true }
syn = { workspace = true, features = ["full"] }
prettyplease = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
nom = { workspace = true }
nom-greedyerror = { workspace = true }
nom-supreme = { workspace = true }
nom_locate = { workspace = true }
convert_case = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
assert-tokenstreams-eq = { workspace = true }
rstest = { workspace = true }
tracing-subscriber = { workspace = true, features = ["regex", "json"] }
