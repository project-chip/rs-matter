[package]
name = "rs-matter-examples"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Native Rust implementation of the Matter (Smart-Home) ecosystem - examples"
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "onoff_light"

[[bin]]
name = "onoff_light_stack"

[[bin]]
name = "onoff_light_switch"

[[bin]]
name = "onoff_light_bt"
required-features = ["zbus"]

[[bin]]
name = "onoff_light_work_stealing"
required-features = ["send-sync"]

[[bin]]
name = "speaker"

[[bin]]
name = "media_player"

[[bin]]
name = "bridge"

[[bin]]
name = "dimmable_light"

[[bin]]
name = "color_light"

[[bin]]
name = "thermostat"

[[bin]]
name = "webrtc_camera"
required-features = ["webrtc"]

[features]
default = ["log"]
log = []
mbedtls = ["rs-matter/mbedtls"]
openssl = ["rs-matter/openssl"]
send-sync = ["rs-matter/send-sync"]
zbus = ["rs-matter/zbus"]
astro-dnssd = ["rs-matter/astro-dnssd"]
zeroconf = ["rs-matter/zeroconf"]
avahi = ["rs-matter/zbus"]
resolve = ["rs-matter/zbus"]
test-tcp = ["rs-matter/large-buffers"]
# Temporary fix for unexpected cfgs lint
defmt = []
webrtc = [
    "dep:str0m",
    "dep:async-channel",
    "dep:tracing",
    "dep:tracing-subscriber",
    "rs-matter/large-buffers",
]

[dependencies]
log = { workspace = true }
env_logger = { workspace = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "tracing-log"], optional = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true, features = ["std"] }
embassy-time-queue-utils = { workspace = true, features = ["generic-queue-64"] }
static_cell = { workspace = true }
if-addrs = { workspace = true }
async-io = { workspace = true }
async-compat = { workspace = true }
blocking = { workspace = true }
futures-lite = { workspace = true }
rs-matter = { workspace = true, features = ["async-io", "groups", "persistent-subscriptions", "max-groups-per-fabric-12", "max-group-keys-per-fabric-3", "max-group-endpoints-per-fabric-3", "max-sessions-32"] }
rand = { workspace = true, features = ["std", "std_rng", "sys_rng", "thread_rng"] }
async-signal = { workspace = true }
socket2 = { workspace = true }
async-executor = { workspace = true }
async-channel = { workspace = true, optional = true }
str0m = { workspace = true, optional = true }

# The `webrtc` feature pulls `str0m` -> `dimpl` -> `rcgen`, and `rcgen` 0.14.8
# fails to compile against `time` >= 0.3.48 (a coherence regression in that
# `time` release: its associated-type-projected `From<HourBase>` impl spuriously
# conflicts with `rcgen`'s blanket `impl<T: Into<String>> From<T> for ...`). We
# don't control `rcgen`, so constrain `time` below 0.3.48 here. This is
# examples-only (`rs-matter` itself doesn't depend on `str0m`/`rcgen`). Remove
# once `rcgen`/`time` resolve the conflict upstream.
time = { version = ">=0.3, <0.3.48", default-features = false }
