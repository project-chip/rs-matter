[package]
name = "rs-matter-dm"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Native Rust implementation of the Matter (Smart-Home) ecosystem - the cluster handlers"
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["os", "log"]
# Umbrella set of features for typical OS-based non-baremetal deployments.
os = ["std", "dep:if-addrs", "rs-matter-node-core/os", "rs-matter-node/os"]
std = ["alloc", "rs-matter-utils/std", "rs-matter-tlv/std", "rs-matter-crypto/std", "rs-matter-cert/std", "rs-matter-im-core/std", "rs-matter-dm-core/std", "rs-matter-dm-clusters/std", "rs-matter-node-core/std", "rs-matter-node/std", "rs-matter-sc/std", "rs-matter-bdx/std"]
alloc = ["defmt?/alloc", "rs-matter-utils/alloc", "rs-matter-tlv/alloc", "rs-matter-crypto/alloc", "rs-matter-cert/alloc", "rs-matter-im-core/alloc", "rs-matter-dm-core/alloc", "rs-matter-dm-clusters/alloc", "rs-matter-node-core/alloc", "rs-matter-node/alloc", "rs-matter-sc/alloc", "rs-matter-bdx/alloc"]
# The NetworkManager and wpa_supplicant Wi-Fi drivers, and the OTBR Thread driver.
zbus = ["os", "dep:zbus", "dep:serde", "futures-lite", "uuid", "rs-matter-utils/zbus", "rs-matter-transport/zbus"]
# Multicast groups support.
groups = ["rs-matter-crypto/groups", "rs-matter-node-core/groups", "rs-matter-node/groups", "rs-matter-sc/groups"]
# CASE session resumption.
case-resumption = ["rs-matter-node/case-resumption", "rs-matter-sc/case-resumption"]
# A small OTA DCL client.
ota-dcl = ["dep:serde", "dep:serde-json-core", "heapless/serde"]
defmt = ["dep:defmt", "heapless/defmt", "rs-matter-utils/defmt", "rs-matter-tlv/defmt", "rs-matter-crypto/defmt", "rs-matter-cert/defmt", "rs-matter-im-core/defmt", "rs-matter-dm-core/defmt", "rs-matter-dm-clusters/defmt", "rs-matter-node-core/defmt", "rs-matter-node/defmt", "rs-matter-sc/defmt", "rs-matter-bdx/defmt"]
log = ["dep:log", "rs-matter-utils/log", "rs-matter-tlv/log", "rs-matter-crypto/log", "rs-matter-cert/log", "rs-matter-im-core/log", "rs-matter-dm-core/log", "rs-matter-dm-clusters/log", "rs-matter-node-core/log", "rs-matter-node/log", "rs-matter-sc/log", "rs-matter-bdx/log"]

[dependencies]
rs-matter-utils = { workspace = true }
rs-matter-tlv = { workspace = true }
rs-matter-crypto = { workspace = true }
rs-matter-cert = { workspace = true }
rs-matter-im-core = { workspace = true }
rs-matter-dm-core = { workspace = true }
rs-matter-dm-clusters = { workspace = true }
rs-matter-node-core = { workspace = true }
rs-matter-node = { workspace = true }
rs-matter-transport = { workspace = true }
rs-matter-sc = { workspace = true }
rs-matter-bdx = { workspace = true }
bitflags = { workspace = true }
either = { workspace = true }
heapless = { workspace = true }
num = { workspace = true }
rand_core = { workspace = true }
scopeguard = { workspace = true }
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
if-addrs = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde-json-core = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
futures-lite = { workspace = true, optional = true }

[target.'cfg(all(unix, not(target_os = "espidf")))'.dependencies]
nix = { workspace = true }

[dev-dependencies]
rs-matter-im = { workspace = true }
rs-matter-crypto = { workspace = true, features = ["rustcrypto"] }
embassy-time-queue-utils = { workspace = true, features = ["generic-queue-64"] }
futures-lite = { workspace = true }

[lints.rust]
# `cargo llvm-cov` sets these when measuring coverage (the second one only on nightly)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }
